<h2>TaskFlow</h2>

<h3>Ajouter une tâche</h3>

<input
  type="text"
  placeholder="Nouvelle tâche"
  [value]="newTask()"
  (input)="newTask.set($any($event.target).value)"
/>

<button (click)="addTask()">Ajouter</button>

<button (click)="emptyTasks()">
  Vider la liste
</button>

<p>
  Tâches restantes : {{ availableTasks().length }}
</p>

@if (emptyStock()) {
  <p>Aucune tâche disponible</p>
}

<p>
  {{ all() }} tâches au total
</p>

<ul>
  @for (task of tasks(); track task.id) {
    <li>

      <input
        type="checkbox"
        [checked]="task.completed"
        (change)="toggleTask(task.id)"
      />

      <span
        [style.color]="task.title | titleColor"
        [style.text-decoration]="task.completed ? 'line-through' : 'none'"
      >
        {{ task.title | uppercase }}
      </span>

      <span>
        {{ task.dueDate | date:'dd/MM/yyyy' }}
      </span>

      <button (click)="deleteTask(task.id)">
        Supprimer
      </button>

    </li>
  }
</ul>
